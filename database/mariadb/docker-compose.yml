# --- TO EXECUTE THIS FILE ---
# 1- Use the following command to create and start containers:
#    docker compose up
#    (use the "-d" argument to run in "detached" mode).
# 2- To stop and remove containers, networks, images, and volumes:
#    docker compose down
#    (use the "-v" argument to remove "volumes" created by docker compose up).
# 3- Browse to http://localhost:8090/ or http://localhost:8091/ and connect with either "root" or "${DB_USER}" user IDs.

# https://mariadb.com/
# https://hub.docker.com/_/mariadb
# https://hub.docker.com/r/phpmyadmin/phpmyadmin/
# https://hub.docker.com/_/adminer/

name: mariadb

services:
  mariadb:
    image: mariadb:latest
    hostname: "${DB_HOST_NAME}"
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${USER_SECRET_KEY:?error}" # Get this password from an environment variable
      MARIADB_ROOT_PASSWORD: "${ADMIN_SECRET_KEY:?error}" # Get this password from an environment variable
    ports:
      # <Port Exposed> : <MariaDB Port running inside the container>
      - ${DB_SRV_PORT}:3306
    volumes:
      - database_files:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${ADMIN_SECRET_KEY}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer:latest
    hostname: adminerHost1
    restart: always
    environment:
      ADMINER_DEFAULT_DB_DRIVER: mysql
      ADMINER_DEFAULT_SERVER: "${DB_HOST_NAME}"
      ADMINER_DESIGN: mvt
      ADMINER_PLUGINS: dump-json dump-xml
    ports:
      - ${WEB_UI_1_PORT}:8080
    depends_on:
      mariadb:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    hostname: phpMyAdminHost1
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_ARBITRARY: 1
    ports:
      - ${WEB_UI_2_PORT}:80
    depends_on:
      mariadb:
        condition: service_healthy

# Names our volume
volumes:
  database_files:
