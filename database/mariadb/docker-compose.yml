# --- TO EXECUTE THIS FILE ---
# 1- Use the following command to create and start containers:
#    docker compose up
#    (use the "-d" argument to run in "detached" mode).
# 2- To stop and remove containers, networks, images, and volumes:
#    docker compose down
#    (use the "-v" argument to remove "volumes" created by docker compose up).
# 3- Browse to http://localhost:8080/ or http://localhost:8081/ and connect with either "root" or "${DB_USER}" user IDs.

# https://docs.docker.com/compose/reference/
# https://docs.docker.com/compose/overview/

# https://mariadb.com/
# https://hub.docker.com/_/mariadb
# https://hub.docker.com/r/phpmyadmin/phpmyadmin/
# https://hub.docker.com/_/adminer/

name: mariadb
# https://docs.docker.com/compose/compose-file/

services:
  mariadb:
    image: mariadb:latest
    command: --default-authentication-plugin=mariadb_native_password
    hostname: "${DB_HOST_NAME}"
    restart: always
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${USER_SECRET_KEY:?error}" # Get this password from an environment variable
      MARIADB_ROOT_PASSWORD: "${ADMIN_SECRET_KEY:?error}" # Get this password from an environment variable
    ports:
      # <Port Exposed> : <MariaDB Port running inside the container>
      - ${DB_SRV_PORT}:3306
    volumes:
      - dbfiles:/var/lib/mysql
    networks:
      - docknet
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    hostname: phpMyAdminHost1
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_ARBITRARY: 1
    ports:
      - ${WEB_UI_1_PORT}:80
    networks:
      - docknet
  adminer:
    image: adminer:latest
    hostname: adminerHost1
    restart: always
    environment:
      ADMINER_DEFAULT_DB_DRIVER: mysql
      ADMINER_DEFAULT_SERVER: "${DB_HOST_NAME}"
      ADMINER_DESIGN: mvt
      ADMINER_PLUGINS: dump-json dump-xml
    ports:
      - ${WEB_UI_2_PORT}:8080
    networks:
      - docknet
# Names our volume
volumes:
  dbfiles:

networks:
  docknet:
    driver: bridge
