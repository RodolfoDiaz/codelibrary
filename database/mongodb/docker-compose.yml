# --- TO EXECUTE THIS FILE ---
# 1- Use the following command to create and start containers:
#    docker compose up
#    (use the "-d" argument to run in "detached" mode).
# 2- To stop and remove containers, networks, images, and volumes:
#    docker compose down
#    (use the "-v" argument to remove "volumes" created by docker compose up).
# 3- Browse to http://localhost:8080/ and connect with "${DB_ROOT_USER}" user ID.

# https://docs.docker.com/compose/reference/
# https://docs.docker.com/compose/overview/

# https://hub.docker.com/_/mongo
# https://hub.docker.com/_/mongo-express

name: mongodb
# https://docs.docker.com/compose/compose-file/

services:
  mongodb:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${ADMIN_SECRET_KEY:?error} # Get this password from an environment variable
    ports:
      # <Port Exposed> : <Port running inside the container>
      - ${DB_SRV_PORT}:27017
    volumes:
      - database_files:/data/db
    healthcheck:
      test: >
        mongosh --quiet
        -u $$MONGO_INITDB_ROOT_USERNAME
        -p $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - docknet
  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - "${WEB_UI_1_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ADMIN_SECRET_KEY:?error} # Get this password from an environment variable
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${DB_ROOT_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ADMIN_SECRET_KEY:?error} # Get this password from an environment variable
      ME_CONFIG_MONGODB_PORT: ${DB_SRV_PORT}
    networks:
      - docknet
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  database_files:

networks:
  docknet:
    driver: bridge
