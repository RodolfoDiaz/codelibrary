# --- TO EXECUTE THIS FILE ---
# 1- Use the following command to create and start containers:
#    docker compose up -d
#    (use the "-d" argument to run in "detached" mode).
# 2- To stop and remove containers, networks, images, and volumes:
#    docker compose down
#    (use the "-v" argument to remove "volumes" created by "docker compose up").
# 3- Browse to http://localhost:8080/ and connect to system "MS SQL (beta)" with "sa" user ID or
#    connect using SQL Server Explorer with server name "127.0.0.1,1433", SQL Server Authentication with "sa" user ID.

# https://docs.docker.com/compose/reference/
# https://docs.docker.com/compose/overview/

# https://hub.docker.com/_/microsoft-mssql-server
# https://docs.microsoft.com/en-us/sql/linux/quickstart-install-connect-docker
# https://hub.docker.com/_/adminer/

name: mssql
# https://docs.docker.com/compose/compose-file/

services:
  sqlserverdb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    user: root # Needed if you want to persist your data in a host directory (see volumes section below)
    container_name: mssql_container1
    hostname: "${DB_HOST_NAME}"
    restart: always
    ports:
      # <Port Exposed> : <Server Port running inside the container>
      - ${MSSQL_TCP_PORT}:1433
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA}"
      MSSQL_SA_PASSWORD: "${ADMIN_SECRET_KEY:?error}" # Get this password from an environment variable
      MSSQL_PID: "${MSSQL_PID}"
      MSSQL_DB: "${MSSQL_DB}" # Optional: Specify a database name to create on startup
      MSSQL_USER: "${MSSQL_USER}" # Optional: Specify a user name to create on startup
      MSSQL_PASSWORD: "${USER_SECRET_KEY:?error}" # Get this password from an environment variable
    volumes:
      # Persist your data (uncomment option 1 or 2)
      # https://docs.microsoft.com/en-us/sql/linux/sql-server-linux-docker-container-configure
      # 1- Mount a host directory as data volume:
      # - ${DB_FOLDER}/sqldata:/var/opt/mssql/data
      # - ${DB_FOLDER}/sqllog:/var/opt/mssql/log
      # - ${DB_FOLDER}/secrets:/var/opt/mssql/secrets
      # - ${DB_FOLDER}/sqlbackup:/var/opt/mssql/backup
      # 2- Use data volume containers:
      - sqlvolume:/var/opt/mssql
    networks:
      - docknet

  adminer:
    image: adminer:latest
    container_name: adminer_container1
    hostname: adminer1
    restart: always
    environment:
      ADMINER_DEFAULT_DB_DRIVER: mssql
      ADMINER_DEFAULT_SERVER: "${DB_HOST_NAME}"
      ADMINER_DESIGN: mvt
      ADMINER_PLUGINS: dump-json dump-xml
    ports:
      - ${WEB_UI_1_PORT}:8080
    networks:
      - docknet

volumes:
  sqlvolume:

networks:
  docknet:
    driver: bridge
