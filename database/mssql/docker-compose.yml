# --- TO EXECUTE THIS FILE ---
# 1- Use the following command to create and start containers:
#    docker compose up
#    (use the "-d" argument to run in "detached" mode).
# 2- To stop and remove containers, networks, images, and volumes:
#    docker compose down
#    (use the "-v" argument to remove "volumes" created by "docker compose up").
# 3- Browse to Adminer tool at http://localhost:8080/?mssql= and connect with "sa" credentials or
#    connect using SQL Server Explorer with server name "127.0.0.1,1433" and SQL Server Authentication with "sa" user ID.

# https://hub.docker.com/_/microsoft-mssql-server
# https://docs.microsoft.com/en-us/sql/linux/quickstart-install-connect-docker
# https://hub.docker.com/_/adminer/

name: mssql

services:
  sqlserverdb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    # user: root # Not recommended
    hostname: "${DB_HOST_NAME:-sqlserverdb}"
    restart: unless-stopped
    ports:
      # <Port Exposed> : <Server Port running inside the container>
      - "${MSSQL_TCP_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${ADMIN_SECRET_KEY:?Error: ADMIN_SECRET_KEY environment variable is required.}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      # Prevents SQL Server from exceeding memory limits assigned to the container
      MSSQL_MEMORY_LIMIT_MB: "2048"
      # Automatically set up a custom database and a standard user account when the container first starts.
      MSSQL_DB: "${MSSQL_DB}"
      MSSQL_USER: "${MSSQL_USER}"
      MSSQL_PASSWORD: "${USER_SECRET_KEY:?Error: USER_SECRET_KEY environment variable is required.}"
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 2048M
    volumes:
      # Persist your data (uncomment option 1 or 2)
      # https://docs.microsoft.com/en-us/sql/linux/sql-server-linux-docker-container-configure
      # 1- Mounting a Docker Named Volume (recommended option, non-root user access):
      - database_files:/var/opt/mssql
      # 2- Host Bind Mount to the container's internal data directory.
      # To prevent Access Denied permission errors ensure the host paths are explicitly chowned (./setupDataFolder.sh).
      # - ${DB_FOLDER}/sqldata:/var/opt/mssql/data
      # - ${DB_FOLDER}/sqllog:/var/opt/mssql/log
      # - ${DB_FOLDER}/secrets:/var/opt/mssql/secrets
      # - ${DB_FOLDER}/sqlbackup:/var/opt/mssql/backup
    networks:
      - docknet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  adminer:
    image: adminer:latest
    hostname: adminer1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_DB_DRIVER: mssql
      ADMINER_DEFAULT_SERVER: "${DB_HOST_NAME:-sqlserverdb}"
      ADMINER_DESIGN: mvt
      ADMINER_PLUGINS: dump-json dump-xml
    ports:
      - "${WEB_UI_1_PORT:-8080}:8080"
    networks:
      - docknet
    depends_on:
      sqlserverdb:
        condition: service_healthy

volumes:
  database_files:
    driver: local

networks:
  docknet:
    driver: bridge

## View Current Health Status
# docker ps --filter "name=sqlserverdb"
## Inspect Healthcheck Detailed Logs and Exit Codes
# docker inspect --format='{{json .State.Health}}' mssql-sqlserverdb-1 | jq
## View Overall Container Logs
# docker compose logs -f sqlserverdb
